<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Session Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="container mt-5">
    <a href="/" class="btn btn-secondary mb-3">&larr; Back</a>

    <div class="row">
        <div class="col-md-4">
            <div class="card text-center mb-4">
                <div class="card-header">Scan to Mark Attendance</div>
                <div class="card-body">
                    <h5 th:text="${attendanceSession.subject}"></h5>
                    <p class="text-muted" th:text="${attendanceSession.sessionDate.toString().replace('T', ' ').substring(0, 16)}"></p>

                    <div id="qrcode" class="d-flex justify-content-center mt-3 mb-3"></div>
                    <p class="small text-muted">Scan this QR code with any mobile device to mark attendance</p>
                    <a id="attendanceLink" href="#" target="_blank">Direct Link</a>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Attendance Records</span>
                    <span class="badge bg-primary rounded-pill" th:text="${records.size()}"></span>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Roll Number</th>
                                <th>Name</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${records.isEmpty()}">
                                <td colspan="3" class="text-center text-muted">No attendance recorded yet.</td>
                            </tr>
                            <tr th:each="record : ${records}">
                                <td th:text="${record.student.rollNumber}"></td>
                                <td th:text="${record.student.name}"></td>
                                <td th:text="${record.markedAt.toString().replace('T', ' ').substring(11, 19)}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var sessionId = /*[[${attendanceSession.id}]]*/ '0';
    var baseUrl = window.location.origin;
    var attendanceUrl = baseUrl + '/mark-attendance/' + sessionId;

    document.getElementById('attendanceLink').href = attendanceUrl;

    new QRCode(document.getElementById("qrcode"), {
        text: attendanceUrl,
        width: 250,
        height: 250,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
    /*]]>*/
</script>
</body>
</html>
