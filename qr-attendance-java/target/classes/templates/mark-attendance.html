<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mark Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .attendance-card {
            max-width: 400px;
            margin: 50px auto;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card attendance-card">
        <div class="card-header bg-primary text-white text-center" style="border-top-left-radius: 15px; border-top-right-radius: 15px;">
            <h4 class="mb-0">Mark Attendance</h4>
        </div>
        <div class="card-body p-4">
            <h5 class="text-center mb-4" th:text="${attendanceSession.subject}"></h5>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/mark-attendance/{id}(id=${attendanceSession.id})}" method="post">
                <div class="mb-3">
                    <label for="rollNumber" class="form-label">Student Roll Number</label>
                    <input type="text" class="form-control form-control-lg" id="rollNumber" name="rollNumber"
                           placeholder="Enter your roll number" required>
                    <div class="form-text">e.g., 101, 102, 103</div>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100">Submit Attendance</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
