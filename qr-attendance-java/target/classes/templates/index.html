<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4 text-center">Student Attendance System</h1>

    <div class="card mb-4">
        <div class="card-header">Create New Session</div>
        <div class="card-body">
            <form th:action="@{/session/create}" method="post" class="d-flex">
                <input type="text" name="subject" class="form-control me-2" placeholder="Subject Name" required>
                <button type="submit" class="btn btn-primary">Create Session</button>
            </form>
        </div>
    </div>

    <h3>All Sessions</h3>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Subject</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sess : ${sessions}">
            <td th:text="${sess.id}"></td>
            <td th:text="${sess.subject}"></td>
            <td th:text="${sess.sessionDate.toString().replace('T', ' ').substring(0, 16)}"></td>
            <td>
                <span th:if="${sess.active}" class="badge bg-success">Active</span>
                <span th:unless="${sess.active}" class="badge bg-danger">Closed</span>
            </td>
            <td>
                <a th:href="@{/session/{id}(id=${sess.id})}" class="btn btn-sm btn-info">View Details &amp; QR</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
